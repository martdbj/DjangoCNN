<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Cats or Horses</title>
</head>
<style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .btn {
            background-color: #BAED16;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
        }
    </style>
<body>

    <h1>AI Animal Classifier</h1>

    <form action="{% url 'upload' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <input type="file" name="image" accept="image/*" required>
        </div>
        <button type="submit" class="btn">Guess</button>
    </form>

    {% if prediction %}
        <div class="result-card">
            <h2>{{ prediction }}!</h2>
            <p><strong>{{ confidence }}</strong></p>
        </div>
    {% endif %}

</body>
</html>
